name: llm_tool_calling_generator
description: Code generator for llm_tool_calling. Turns @Tool-annotated Dart functions into LLM tool definitions with JSON schemas.
version: 0.1.0
repository: https://github.com/amitgp853/llm_tool_calling/tree/main/llm_tool_calling_generator
issue_tracker: https://github.com/amitgp853/llm_tool_calling/issues
topics:
  - llm
  - tool-calling
  - function-calling
  - ai-agents
  - codegen
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.0.0
  build: ^4.0.10
  llm_tool_calling: ^0.1.0
  source_gen: ^4.2.4

dev_dependencies:
  build_test: ^3.5.0
  glob: ^2.2.0
  lints: ^6.0.0
  test: ^1.32.0
