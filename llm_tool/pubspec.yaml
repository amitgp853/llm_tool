name: llm_tool
description: Turn Dart functions into LLM tools for OpenAI, Gemini, Claude and MCP. Annotate with @LlmTool to generate the JSON schema, argument validation and typed calls.
version: 0.8.0
repository: https://github.com/amitgp853/llm_tool/tree/main/llm_tool
homepage: https://amitgp.dev
issue_tracker: https://github.com/amitgp853/llm_tool/issues
topics:
  - llm
  - tool-calling
  - function-calling
  - ai-agents
  - codegen
resolution: workspace

environment:
  sdk: ^3.11.0

dev_dependencies:
  anthropic_sdk_dart: ^9.0.0
  lints: ^6.0.0
  mcp_dart: ^2.4.2
  openai_dart: ^10.0.0
  test: ^1.32.0
