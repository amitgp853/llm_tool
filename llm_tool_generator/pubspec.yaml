name: llm_tool_generator
description: Code generator for llm_tool. Turns @LlmTool-annotated Dart functions into LLM tools for OpenAI, Gemini, Claude and MCP, with JSON schemas and validation.
version: 1.0.0
repository: https://github.com/amitgp853/llm_tool/tree/main/llm_tool_generator
homepage: https://amitgp.dev
issue_tracker: https://github.com/amitgp853/llm_tool/issues
topics:
  - llm
  - tool-calling
  - function-calling
  - ai-agents
  - codegen
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.0.0
  build: ^4.0.10
  llm_tool: ^1.0.0
  source_gen: ^4.2.4

dev_dependencies:
  build_test: ^3.5.0
  glob: ^2.2.0
  lints: ^6.0.0
  test: ^1.32.0
